{% extends "admin/layout.html" %}
{% block title %}{{ 'Edit Employee' if edit_mode else 'Add Employee' }} | TRUNOW{% endblock %}
{% block admin_content %}
<div class="soft-card p-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="mb-1">{{ 'Edit Employee' if edit_mode else 'Add Employee' }}</h4>
            <p class="mini-muted mb-0">Manage employee profile, access, and organizational details.</p>
        </div>
        <a href="{{ url_for('admin_employees') }}" class="btn btn-outline-primary">Back</a>
    </div>
    <form method="post" enctype="multipart/form-data">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Employee ID</label>
                <input class="form-control" name="employee_id" value="{{ employee.employee_id if employee else '' }}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Full Name</label>
                <input class="form-control" name="full_name" value="{{ employee.full_name if employee else '' }}" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">Username</label>
                <input class="form-control" name="username" value="{{ employee.username if employee else '' }}" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">Phone</label>
                <input class="form-control" name="phone" value="{{ employee.phone if employee else '' }}" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" name="email" value="{{ employee.email if employee else '' }}" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">Department</label>
                <input class="form-control" name="department" value="{{ employee.department if employee else '' }}" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">Designation</label>
                <input class="form-control" name="designation" value="{{ employee.designation if employee else '' }}" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">Role</label>
                <input class="form-control" name="role" value="{{ employee.role if employee else 'Employee' }}" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">Monthly Salary</label>
                <input type="number" step="0.01" min="0" class="form-control" name="monthly_salary" value="{{ employee.monthly_salary if employee else '0' }}" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">{{ 'Reset Password' if edit_mode else 'Password' }}</label>
                <input type="password" class="form-control" name="password" {{ '' if edit_mode else 'required' }}>
            </div>
            <div class="col-md-6">
                <label class="form-label">Profile Photo</label>
                <input type="file" class="form-control" name="profile_photo" accept=".png,.jpg,.jpeg,.webp">
            </div>
            <div class="col-md-6">
                <label class="form-label">Status</label>
                <select class="form-select" name="status">
                    {% for option in ['Active', 'Inactive'] %}
                    <option value="{{ option }}" {% if employee and employee.status == option %}selected{% endif %}>{{ option }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Night Shift Access</label>
                <select class="form-select" name="night_shift_allowed">
                    <option value="0" {% if not employee or employee.night_shift_allowed in [0, '0', None, ''] %}selected{% endif %}>Disabled</option>
                    <option value="1" {% if employee and employee.night_shift_allowed in [1, '1'] %}selected{% endif %}>Enabled</option>
                </select>
            </div>
            <div class="col-12">
                <hr class="my-1">
            </div>
            <div class="col-md-4">
                <label class="form-label">Bank A/c No</label>
                <input
                    class="form-control"
                    name="bank_account_no"
                    value="{{ employee.bank_account_no if employee else '' }}"
                    inputmode="numeric"
                    pattern="[0-9]+"
                    title="Bank Account Number should contain numbers only"
                >
            </div>
            <div class="col-md-4">
                <label class="form-label">IFSC Code</label>
                <input
                    class="form-control text-uppercase"
                    name="ifsc_code"
                    value="{{ employee.ifsc_code if employee else '' }}"
                    maxlength="11"
                    pattern="[A-Za-z]{4}0[A-Za-z0-9]{6}"
                    title="IFSC Code must be in the format HDFC0001234"
                    oninput="this.value = this.value.toUpperCase()"
                >
            </div>
            <div class="col-md-4">
                <label class="form-label">Bank Name</label>
                <input
                    class="form-control"
                    name="bank_name"
                    value="{{ employee.bank_name if employee else '' }}"
                    title="Bank Name should contain text only"
                >
            </div>
        </div>
        <button class="btn btn-primary mt-4">{{ 'Update Employee' if edit_mode else 'Create Employee' }}</button>
    </form>
</div>
{% endblock %}
